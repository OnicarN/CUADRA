<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Precios · Cuadra</title>
  <meta name="description" content="Cuadra lee tus tickets y facturas y te avisa de lo que estás perdiendo antes de que cierre el trimestre.">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/paginas/precios.css">
  <script>try{var t=localStorage.getItem('cuadra-tema');if(t==='claro'||t==='oscuro')document.documentElement.dataset.tema=t}catch(e){}</script>
  <script type="module" src="/js/paginas/precios.js"></script>
</head>
<body>
  <!-- Página de precios (RF-02, RF-03). Los planes vienen de /api/suscripcion/planes -->
  <main class="contenedor">
    <section class="precios-cabecera">
      <h1 class="titulo-pagina" data-t="precios.titulo"></h1>
      <p class="texto-2" data-t="precios.subtitulo"></p>
      <div class="banner precios-prueba" data-icono="destello"><span class="banner-texto" id="texto-prueba"></span></div>
    </section>
    <section class="rejilla planes" id="planes" aria-live="polite"></section>

    <section class="precios-extras">
      <h2 class="titulo-seccion" data-t="precios.extras.titulo"></h2>
      <p class="texto-2" data-t="precios.extras.texto"></p>
      <div class="rejilla" id="extras"></div>
    </section>

    <section class="precios-incluido tarjeta">
      <h2 class="titulo-seccion" data-t="precios.todos.titulo"></h2>
      <ul class="lista-check" id="incluido-todos"></ul>
    </section>
  </main>
</body>
</html>
