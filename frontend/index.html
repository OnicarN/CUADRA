<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cuadra · Tus facturas y tickets, cuadrados</title>
  <meta name="description" content="Cuadra lee tus tickets y facturas y te avisa de lo que estás perdiendo antes de que cierre el trimestre.">
  <meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/paginas/inicio.css">
  <script>try{var t=localStorage.getItem('cuadra-tema');if(t==='claro'||t==='oscuro')document.documentElement.dataset.tema=t}catch(e){}</script>
  <script type="module" src="/js/paginas/inicio.js"></script>
</head>
<body>
  <!-- Página de inicio pública (RF-01). La cabecera y el pie los pinta js/core/layout.js -->
  <main>
    <section class="contenedor hero">
      <div class="hero-texto">
        <span class="etiqueta etiqueta-pendiente" data-t="inicio.etiqueta"></span>
        <h1 class="hero-titulo" data-t="inicio.titulo"></h1>
        <p class="hero-sub" data-t="inicio.subtitulo"></p>
        <div class="hero-acciones">
          <a class="boton boton-principal" href="/registro" data-t="inicio.empezar"></a>
          <a class="boton boton-secundario" href="/precios" data-t="inicio.verPrecios"></a>
        </div>
        <p class="texto-2" data-t="inicio.prueba"></p>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <div class="tarjeta maqueta-cifra">
          <p class="tarjeta-titulo" data-t="inicio.maqueta.gasto"></p>
          <p class="cifra" data-dinero="2184.30"></p>
          <p class="tarjeta-apoyo"><span class="baja">↓ 12 %</span> <span data-t="inicio.maqueta.vsTrimestre"></span></p>
          <div class="maqueta-barras">
            <span style="height:40%"></span><span style="height:65%"></span><span style="height:52%"></span>
            <span style="height:80%"></span><span style="height:58%"></span><span class="activa" style="height:92%"></span>
          </div>
        </div>
        <div class="tarjeta maqueta-iva">
          <p class="tarjeta-titulo" data-t="inicio.maqueta.iva"></p>
          <p class="cifra cifra-media" data-dinero="384.12"></p>
          <p class="tarjeta-apoyo" data-t="inicio.maqueta.modelo"></p>
        </div>
        <div class="banner banner-aviso maqueta-banner" data-icono="alerta">
          <span class="banner-texto" data-t="inicio.maqueta.sinNif"></span>
        </div>
        <div class="tarjeta maqueta-lista">
          <ul class="lista">
            <li class="fila"><span class="fila-icono" data-icono="facturas"></span><span class="fila-centro"><span class="fila-titulo">Repsol</span><span class="fila-sub" data-t="inicio.maqueta.combustible"></span></span><span class="fila-derecha"><span class="importe" data-dinero="60.00"></span><br><span class="etiqueta etiqueta-pendiente" data-t="estado.pendiente"></span></span></li>
            <li class="fila"><span class="fila-icono" data-icono="facturas"></span><span class="fila-centro"><span class="fila-titulo">Movistar</span><span class="fila-sub" data-t="inicio.maqueta.telefono"></span></span><span class="fila-derecha"><span class="importe" data-dinero="49.99"></span><br><span class="etiqueta etiqueta-confirmada" data-t="estado.confirmada"></span></span></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="contenedor seccion">
      <h2 class="seccion-titulo" data-t="inicio.ideas.titulo"></h2>
      <div class="rejilla">
        <article class="tarjeta idea"><span class="idea-icono" data-icono="camara"></span><h3 class="titulo-seccion" data-t="inicio.ideas.simple"></h3><p class="texto-2" data-t="inicio.ideas.simpleTexto"></p></article>
        <article class="tarjeta idea"><span class="idea-icono" data-icono="euro"></span><h3 class="titulo-seccion" data-t="inicio.ideas.barato"></h3><p class="texto-2" data-t="inicio.ideas.baratoTexto"></p></article>
        <article class="tarjeta idea"><span class="idea-icono" data-icono="avisos"></span><h3 class="titulo-seccion" data-t="inicio.ideas.avisa"></h3><p class="texto-2" data-t="inicio.ideas.avisaTexto"></p></article>
      </div>
    </section>

    <section class="contenedor seccion">
      <h2 class="seccion-titulo" data-t="inicio.pasos.titulo"></h2>
      <ol class="pasos">
        <li class="tarjeta paso"><span class="paso-numero">1</span><h3 class="titulo-seccion" data-t="inicio.pasos.uno"></h3><p class="texto-2" data-t="inicio.pasos.unoTexto"></p></li>
        <li class="tarjeta paso"><span class="paso-numero">2</span><h3 class="titulo-seccion" data-t="inicio.pasos.dos"></h3><p class="texto-2" data-t="inicio.pasos.dosTexto"></p></li>
        <li class="tarjeta paso"><span class="paso-numero">3</span><h3 class="titulo-seccion" data-t="inicio.pasos.tres"></h3><p class="texto-2" data-t="inicio.pasos.tresTexto"></p></li>
      </ol>
    </section>

    <section class="contenedor seccion">
      <div class="tarjeta avisos-bloque">
        <div>
          <h2 class="seccion-titulo" data-t="inicio.avisos.titulo"></h2>
          <p class="texto-2" data-t="inicio.avisos.texto"></p>
        </div>
        <ul class="avisos-lista">
          <li class="banner banner-aviso" data-icono="alerta"><span class="banner-texto" data-t="inicio.avisos.sinNif"></span></li>
          <li class="banner banner-aviso" data-icono="alerta"><span class="banner-texto" data-t="inicio.avisos.duplicado"></span></li>
          <li class="banner" data-icono="reloj"><span class="banner-texto" data-t="inicio.avisos.trimestre"></span></li>
          <li class="banner" data-icono="destello"><span class="banner-texto" data-t="inicio.avisos.evento"></span></li>
        </ul>
      </div>
    </section>

    <section class="contenedor seccion">
      <h2 class="seccion-titulo" data-t="inicio.funciones.titulo"></h2>
      <div class="rejilla">
        <article class="tarjeta funcion"><span data-icono="informes"></span><div><h3 class="titulo-seccion" data-t="inicio.funciones.panel"></h3><p class="texto-2" data-t="inicio.funciones.panelTexto"></p></div></article>
        <article class="tarjeta funcion"><span data-icono="descargar"></span><div><h3 class="titulo-seccion" data-t="inicio.funciones.excel"></h3><p class="texto-2" data-t="inicio.funciones.excelTexto"></p></div></article>
        <article class="tarjeta funcion"><span data-icono="archivo"></span><div><h3 class="titulo-seccion" data-t="inicio.funciones.informe"></h3><p class="texto-2" data-t="inicio.funciones.informeTexto"></p></div></article>
        <article class="tarjeta funcion"><span data-icono="correo"></span><div><h3 class="titulo-seccion" data-t="inicio.funciones.correo"></h3><p class="texto-2" data-t="inicio.funciones.correoTexto"></p></div></article>
        <article class="tarjeta funcion"><span data-icono="calendario"></span><div><h3 class="titulo-seccion" data-t="inicio.funciones.calendario"></h3><p class="texto-2" data-t="inicio.funciones.calendarioTexto"></p></div></article>
        <article class="tarjeta funcion"><span data-icono="movil"></span><div><h3 class="titulo-seccion" data-t="inicio.funciones.movil"></h3><p class="texto-2" data-t="inicio.funciones.movilTexto"></p></div></article>
      </div>
    </section>

    <section class="contenedor seccion">
      <div class="confianza">
        <span data-icono="escudo"></span>
        <div>
          <h2 class="titulo-seccion" data-t="inicio.confianza.titulo"></h2>
          <p class="texto-2" data-t="inicio.confianza.texto"></p>
        </div>
      </div>
    </section>

    <section class="contenedor seccion">
      <div class="tarjeta cta-final">
        <h2 class="seccion-titulo" data-t="inicio.final.titulo"></h2>
        <p class="texto-2" data-t="inicio.final.texto"></p>
        <a class="boton boton-principal" href="/registro" data-t="inicio.empezar"></a>
      </div>
    </section>
  </main>
</body>
</html>
