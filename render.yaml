# Despliegue en Render (https://render.com). Paso a paso en docs/DESPLIEGUE.md.
# Un único servicio sirve la web (frontend/) y la API (backend/).
# La base de datos es PostgreSQL en Neon (gratis): su URL va en DATABASE_URL.
#
# Sin rootDir a propósito: así cualquier cambio en frontend/ o backend/ despliega.
services:
  - type: web
    name: cuadra
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRETO
        generateValue: true
      - key: MODELO_IA
        value: claude-opus-5-5
      # Te las pide Render al crear el servicio:
      - key: DATABASE_URL
        sync: false
      - key: URL_PUBLICA
        sync: false
      # El resto (ANTHROPIC_API_KEY, SMTP_*, GOOGLE_*, STRIPE_*, CORREO_*) se añaden
      # después en Render > cuadra > Environment, cuando cada parte esté hecha.
